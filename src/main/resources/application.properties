spring.application.name=github-repo-searcher

server.port=${PORT:8080}

# DB_URL wins; otherwise the URL is built from parts (how Render's managed PostgreSQL exposes them).
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:github}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=15s

github.api-url=https://api.github.com
# Optional. Without a token GitHub allows 10 searches a minute, with one it's 30.
github.token=${GITHUB_TOKEN:}
github.per-page=100

management.endpoints.web.exposure.include=health,info

# Self keep-alive: pings <url>/actuator/health so a free-tier host doesn't put the app to sleep.
# Off unless a public URL is known (Render sets RENDER_EXTERNAL_URL automatically).
keep-alive.url=${KEEP_ALIVE_URL:${RENDER_EXTERNAL_URL:}}
keep-alive.interval=PT10M
